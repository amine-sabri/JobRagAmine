[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobrag"
version = "0.1.0"
description = "Evaluated RAG assistant over real job offers"
authors = [{ name = "Amine Sabri" }]
requires-python = ">=3.11"
# Runtime dependencies are pinned in requirements.txt (pip-tools), which is what
# CI and the Makefile install. This keeps one single source of truth for versions.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "-q", "--strict-markers", "-m", "not integration"]
markers = [
  "integration: needs the pgvector container up (make up); excluded by default",
]
